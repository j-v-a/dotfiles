name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Secret scan (full history)
        run: nix run --inputs-from . nixpkgs#gitleaks -- git --redact --no-banner .
      - name: Evaluate missandei
        run: nix eval --raw .#nixosConfigurations.missandei.config.system.build.toplevel.drvPath
