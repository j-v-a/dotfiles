name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly full build (03:00 UTC)
  workflow_dispatch:

# One run per ref: a new push cancels the in-flight run for the same branch/PR.
# Nightly runs get their own group so a push to main does not cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Secret scan (full history)
        run: nix run --inputs-from . nixpkgs#gitleaks -- git --redact --no-banner .
      # No --no-build: missandei eval needs import-from-derivation (catppuccin-firefox).
      - name: Flake check (eval + treefmt formatting check)
        run: nix flake check

  # Full system build: catches failures that eval alone misses (hashes, broken
  # packages). Runner disk is too small for the closure without nothing-but-nix.
  # Slow (~40 min cold), so only for lock-bump PRs (update-flake-lock's default branch
  # update_flake_lock_action), the nightly schedule and manual runs.
  build:
    needs: check
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'update_flake_lock_action')
    runs-on: ubuntu-latest
    steps:
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build missandei
        run: nix build --print-build-logs .#nixosConfigurations.missandei.config.system.build.toplevel
