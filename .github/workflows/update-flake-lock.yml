name: update-flake-lock

# Weekly lock bump as a PR (lock diff in the PR body). Review + merge, then
# `nix flake update dotfiles` in dotfiles-private.
# PR branch: update_flake_lock_action (check.yml runs the full build for it).
# Note: PRs opened with GITHUB_TOKEN don't trigger other workflows — run `check`
# on the PR branch via "Run workflow" (workflow_dispatch) before merging.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake.lock: update"
          pr-labels: dependencies
